name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"        # macOS system Python; no longer shipped for Ubuntu 26.04
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  ios:
    name: iPhone port (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests against docs/moodle-brief.js
        env:
          TZ: Europe/Istanbul
        run: for f in tests/ios/*.js; do node "$f"; done
